# One-click deploy on Render (https://render.com): New → Blueprint → pick this repo.
services:
  - type: web
    name: record-ai
    runtime: docker
    plan: starter            # persistent disks need a paid plan
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD
        sync: false          # you'll be asked for it
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
