# Is record.ai up? Checked every 15 minutes from GitHub, for free. When it is
# down, an issue "record.ai is down" opens (GitHub emails you); when it is
# back, the issue closes. Set the APP_URL variable (Settings → Secrets and
# variables → Actions → Variables) when you move to your own domain.
name: Uptime
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ vars.APP_URL || 'https://record-ai-nina.fly.dev' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Ask the app if it is up (three tries)
        id: check
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 20 "$URL/api/health" | grep -q '"ok":true'; then echo "up=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 20
          done
          echo "up=false" >> "$GITHUB_OUTPUT"
      - name: Open or close the alert
        env:
          UP: ${{ steps.check.outputs.up }}
        run: |
          open=$(gh issue list --label down --state open --json number --jq '.[0].number')
          if [ "$UP" = "false" ] && [ -z "$open" ]; then
            gh label create down --color B60205 --description "The app is not answering" --force
            gh issue create --label down --title "record.ai is down" --body "The health check at $URL/api/health did not answer three times in a row ($(date -u '+%Y-%m-%d %H:%M UTC')). Check the Fly.io dashboard or run: fly status, fly logs. This issue closes by itself when the app answers again."
          elif [ "$UP" = "true" ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "Back up at $(date -u '+%Y-%m-%d %H:%M UTC')."
          fi
