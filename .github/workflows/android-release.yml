# Builds the Android app for Google Play: a signed App Bundle (.aab) to upload
# in Play Console. Run it by hand: Actions → "Android release" → Run workflow.
# It needs four repository secrets (Settings → Secrets and variables → Actions),
# made once as described in docs/ReleaseAppStore.md, "Android, step 3":
#   SORTMEMO_UPLOAD_KEYSTORE_BASE64   the upload key file, as base64 text
#   SORTMEMO_UPLOAD_STORE_PASSWORD    its password
#   SORTMEMO_UPLOAD_KEY_ALIAS         the key's name inside it (for example "upload")
#   SORTMEMO_UPLOAD_KEY_PASSWORD      the key's password
name: Android release

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: The upload key, from the repository's secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SORTMEMO_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The upload key secrets are not set up yet (docs/ReleaseAppStore.md, Android step 3)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "SORTMEMO_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the signed App Bundle
        env:
          SORTMEMO_UPLOAD_STORE_PASSWORD: ${{ secrets.SORTMEMO_UPLOAD_STORE_PASSWORD }}
          SORTMEMO_UPLOAD_KEY_ALIAS: ${{ secrets.SORTMEMO_UPLOAD_KEY_ALIAS }}
          SORTMEMO_UPLOAD_KEY_PASSWORD: ${{ secrets.SORTMEMO_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:bundleRelease
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: The App Bundle to upload to Google Play
        uses: actions/upload-artifact@v4
        with:
          name: sortmemo-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
