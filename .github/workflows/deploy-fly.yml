# Puts record.ai online on Fly.io after every change to main, once the tests pass.
# Turned on by adding a FLY_API_TOKEN secret to the repository (docs/DEPLOY_FLY.md);
# without it, this does nothing.
name: Deploy to Fly.io

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency: deploy-fly
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip unless Fly.io is set up
        id: check
        run: echo "ready=${{ env.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.ready == 'true'
      - run: flyctl deploy --remote-only
        if: steps.check.outputs.ready == 'true'
